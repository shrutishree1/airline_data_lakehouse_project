resources:
  jobs:
    BronzeIngestion:
      name: BronzeIngestion
      tasks:
        - task_key: Parameters
          notebook_task:
            notebook_path: /Workspace/Databricks End to End Project/src_parameters
            source: WORKSPACE
        - task_key: Incremental_Ingestion
          depends_on:
            - task_key: Parameters
          for_each_task:
            inputs: "{{tasks.Parameters.values.output_key}}"
            task:
              task_key: Incremental_Ingestion_iteration
              notebook_task:
                notebook_path: /Workspace/Databricks End to End Project/bronze
                base_parameters:
                  src: "{{input.src}}"
                source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
